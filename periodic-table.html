<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periodic table</title>
<style>
  :root {
    --bg: #fafaf8; --card: #ffffff; --text: #1a1a1a; --text-secondary: #666;
    --border: #ddd; --border-strong: #999;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --card: #222325; --text: #e8e8e6; --text-secondary: #a0a0a0;
      --border: #3a3b3d; --border-strong: #555; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 16px; }
  .controls { display: flex; gap: 8px; margin-bottom: 16px; }
  button.mode {
    padding: 6px 14px; font-size: 13px; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--border-strong); background: transparent; color: var(--text);
  }
  button.mode.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  #wrap { overflow-x: auto; }
  #grid { display: grid; gap: 2px; margin: 0 0 16px; width: max-content; }
  .el {
    position: relative; display: flex; flex-direction: column; align-items: center;
    justify-content: center; border-radius: 4px; cursor: pointer; line-height: 1;
    border: 1px solid rgba(0,0,0,0.08);
  }
  .el:hover { outline: 2px solid var(--border-strong); }
  .el .num { position: absolute; top: 2px; left: 3px; font-size: 9px; opacity: .75; }
  .el .sym { font-weight: 600; }
  .el .mass { font-size: 9px; margin-top: 1px; opacity: .85; }
  #detail {
    min-height: 56px; padding: 12px 16px; border-radius: 8px; background: var(--card);
    border: 1px solid var(--border); font-size: 13px; color: var(--text-secondary);
  }
  #detail .name { font-size: 15px; font-weight: 600; color: var(--text); }
  #detail a {
    margin-left: auto; padding: 6px 12px; font-size: 13px; border-radius: 6px;
    border: 1px solid var(--border-strong); color: var(--text); text-decoration: none; white-space: nowrap;
  }
  #detail a:hover { background: var(--border); }
  #detail .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  #legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 16px 0 0; font-size: 12px; color: var(--text-secondary); }
  #legend span.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
</style>
</head>

function pos(e, mode) {
  const [n, sym, name, p, g] = e;
  if (g === 0) {
    const fidx = p === 6 ? n - 57 : n - 89;
    if (mode === "wide") return { row: p, col: 3 + fidx };
    return { row: p === 6 ? 9 : 10, col: 3 + fidx };
  }
  if (mode === "wide" && p >= 6 && g >= 3) return { row: p, col: g + 14 };
  return { row: p, col: g };
}

let mode = "standard";
const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;

function render() {
  const grid = document.getElementById("grid");
  const wide = mode === "wide";
  const cols = wide ? 32 : 18, rows = wide ? 7 : 10;
  const cw = wide ? 22 : 38, ch = wide ? 46 : 52;
  const symFont = wide ? "12px" : "15px";
  grid.style.gridTemplateColumns = `repeat(${cols}, ${cw}px)`;
  grid.style.gridTemplateRows = `repeat(${rows}, ${ch}px)`;
  grid.innerHTML = "";
  EL.forEach(e => {
    const { row, col } = pos(e, mode);
    const [n, sym, , , , cat, mass] = e;
    const [bgL, bgD, txL, txD] = CAT[cat];
    const d = document.createElement("div");
    d.className = "el";
    d.style.gridRow = row; d.style.gridColumn = col;
    d.style.background = dark ? bgD : bgL;
    d.style.color = dark ? txD : txL;
    d.innerHTML = `<span class="num">${n}</span><span class="sym" style="font-size:${symFont}">${sym}</span><span class="mass">${Math.round(mass)}</span>`;
    d.onclick = () => select(e);
    grid.appendChild(d);
  });
}

function setMode(m) {
  mode = m;
  document.getElementById("btn-standard").classList.toggle("active", m === "standard");
  document.getElementById("btn-wide").classList.toggle("active", m === "wide");
  render();
}

function select(e) {
  const [n, sym, name, , , cat, mass] = e;
  const label = CAT[cat][4];
  const blurb = BLURB[sym] || "";
  document.getElementById("detail").innerHTML = `
    <div class="row">
      <div><span class="name">${name}</span>
      <span> &middot; ${sym} &middot; #${n} &middot; ${mass} u &middot; ${label}</span></div>
      <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(name)}" target="_blank" rel="noopener">View on Wikipedia</a>
    </div>
    <p style="margin:8px 0 0;line-height:1.5">${blurb}</p>`;
}

function renderLegend() {
  const legend = document.getElementById("legend");
  legend.innerHTML = Object.entries(CAT).map(([k, v]) =>
    `<span><span class="sw" style="background:${dark ? v[1] : v[0]}"></span>${v[4]}</span>`
  ).join("");
}

render();
renderLegend();
</script>
</body>
