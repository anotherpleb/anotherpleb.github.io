name: Build Index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate index.html
        run: |
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <title>My Projects</title>
          <style>
            body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
            h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
            h2 { margin-top: 30px; color: #555; font-size: 1em; text-transform: uppercase; letter-spacing: 0.05em; }
            ul { list-style: none; padding: 0; }
            li { margin: 10px 0; }
            a { text-decoration: none; color: #0366d6; font-size: 1.1em; }
            a:hover { text-decoration: underline; }
          </style>
          </head>
          <body>
          <h1>My Projects</h1>
          EOF
          if [ -f welcome.html ]; then
            cat welcome.html >> index.html
          fi

          # collect "timestamp|filename", newest first
          entries=$(for f in *.html; do
            if [ "$f" != "index.html" ] && [ "$f" != "welcome.html" ]; then
              ts=$(git log --diff-filter=A --follow --format=%aI -- "$f" | tail -1)
              if [ -z "$ts" ]; then ts=$(date -Iseconds); fi
              echo "$ts|$f"
            fi
          done | sort -r)

          current_month=""
          echo "$entries" | while IFS='|' read -r ts f; do
            [ -z "$f" ] && continue
            month=$(date -d "$ts" "+%B %Y")
            name=$(basename "$f" .html)
            if [ "$month" != "$current_month" ]; then
              if [ -n "$current_month" ]; then echo "</ul>" >> index.html; fi
              echo "<h2>$month</h2><ul>" >> index.html
              current_month="$month"
            fi
            echo "<li><a href=\"$f\">$name</a></li>" >> index.html
          done
          echo "</ul></body></html>" >> index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update index"
          git push
